name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        working-directory: packages/contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Contracts
        working-directory: packages/contracts
        run: forge test -vv
        # Mirrors `pnpm test:contracts`; run here so it fails before the Node
        # toolchain is even installed.

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # node:sqlite is built in, so the log store needs no native build step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Protocol libraries
        run: pnpm test:protocol

      - name: Log store
        run: pnpm test:log

      - name: API
        run: pnpm test:api


      # Import integrity, the grasp timeline, and the two cross-implementation
      # checks: browser keccak against viem, and the browser sampler against
      # the exporter. If either drifts, the site shows a world that is not the
      # one an episode was recorded in.
      - name: Web modules
        run: pnpm test:web

      # The published samples are checked against the live deployment, so a
      # broken sample cannot sit on the site unnoticed. Network-dependent, so
      # it does not fail the build when Monad is unreachable.
      - name: Published samples verify on chain
        run: pnpm test:samples
        continue-on-error: true
