name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # T-033: the golden demo path (PLAN §21) end to end, nightly, against
    # two local Anvils — `continue-on-error` (this job and its one step)
    # since it is a much heavier, network/timing-sensitive run than the
    # rest of CI and is not meant to block a merge (PLAN §24's release gate
    # is where §21 running against Fuji + a mirror is actually required).
    - cron: "17 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        working-directory: packages/contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Contracts
        working-directory: packages/contracts
        run: forge test -vv
        # Mirrors `pnpm test:contracts`; run here so it fails before the Node
        # toolchain is even installed.

      - name: Invariant tests
        working-directory: packages/contracts
        run: forge test --match-path 'test/invariant/*' -vv

      - name: Gas snapshot
        working-directory: packages/contracts
        run: forge snapshot --check
        continue-on-error: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # node:sqlite is built in, so the log store needs no native build step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Protocol libraries
        run: pnpm test:protocol

      # T-008 / PLAN §5 I-5: the vectors generator is deterministic, so
      # regenerating it must reproduce the checked-in Solidity and JSON
      # vector files byte-for-byte. A diff here means TS and Solidity (or
      # the fixtures) have drifted apart, or the generator picked up
      # non-determinism.
      - name: Vectors are up to date and deterministic
        run: pnpm vectors && git diff --exit-code packages/contracts/test/Vectors.sol packages/protocol/test/fixtures/vectors.json

      # T-009: `apps/web/chains.js` is generated from `.env.contracts`
      # (absent here — no secrets in CI) falling back to
      # `.env.contracts.example`. Regenerating it must reproduce the
      # checked-in file byte-for-byte, or a page could ship an address the
      # deploy scripts never produced.
      - name: chains.js is up to date
        run: pnpm gen:chains && git diff --exit-code apps/web/chains.js

      - name: Log store
        run: pnpm test:log

      - name: API
        run: pnpm test:api

      - name: Verification checks
        run: pnpm test:verify

      # T-030: the adversarial suite — every PLAN §7 threat attempted
      # against the TS reference, the Solidity, and the API, asserting
      # each is refused with the specific named error. Regression guard
      # for I-10.
      - name: Adversarial suite
        run: pnpm test:adversarial

      # Import integrity, the grasp timeline, and the two cross-implementation
      # checks: browser keccak against viem, and the browser sampler against
      # the exporter. If either drifts, the site shows a world that is not the
      # one an episode was recorded in.
      - name: Web modules
        run: pnpm test:web

      # The published samples are checked against the live deployment, so a
      # broken sample cannot sit on the site unnoticed. Network-dependent, so
      # it does not fail the build when Monad is unreachable.
      - name: Published samples verify on chain
        run: pnpm test:samples
        continue-on-error: true

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Slither
        uses: crytic/slither-action@v0.3.0
        with:
          target: packages/contracts
          fail-on: high

  golden-demo-nightly:
    # T-033, PLAN §21/§24: the golden demo path end to end against two
    # local Anvils, on a schedule only — `continue-on-error` because this
    # is a heavier, timing-sensitive integration run, not the fast gate the
    # `push`/`pull_request` `test` job is.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        working-directory: packages/contracts
        run: forge install foundry-rs/forge-std --no-git

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Golden demo (--local)
        run: pnpm demo:golden --local
        continue-on-error: true
