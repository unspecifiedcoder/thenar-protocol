<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Thenar</title>
  <!-- The thenar eminence is the mound at the base of the thumb, and its job
       is opposition: swinging the thumb across to meet each fingertip. So the
       mark is that arc and the four points it reaches, nothing else. At 16px
       the fingertip dots merge into a dotted edge, which still reads. -->
  <rect width="32" height="32" rx="7" fill="#4D17F5"/>
  <path d="M8 25 C8 13, 14 7, 24 7" fill="none" stroke="#fff"
        stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="8" cy="25" r="3.4" fill="#FA9DCD"/>
</svg>
